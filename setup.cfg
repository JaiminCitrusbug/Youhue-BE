[mutmut]
# BE mutation testing (kit backend_mutation gate). Runs in a Linux container (KIT_ADAPTATIONS A-4):
# mutmut has no native Windows support. --use-coverage restricts each mutant to its covering tests.
# Scope note: start on the safety-critical risk pipeline; widen once feasibility is confirmed.
paths_to_mutate=src/application/risk/
runner=python -m pytest -x -q tests/test_risk.py
