[project]
name = "youhue-be"
version = "0.1.0"
description = "Youhue — Student Wellbeing Check-in Platform (backend, FastAPI)"
requires-python = ">=3.12"

# ---- gate tool config (the validation gate runs these) ----
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage is applied by the kit gate explicitly (make verify runs `pytest --cov --cov-fail-under`);
# keep it out of addopts so targeted runs (e.g. `pytest -m authz`) are not coverage-gated.
addopts = "--strict-markers"
markers = [
    "authz: authorization deny-cell test — a forbidden action MUST fail (Spine #7 deny-cell coverage)",
]

[tool.coverage.run]
source = ["src", "config", "main"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "config", "."]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# tests may use assert (S101) — allowed there
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "S105", "S106", "S107"]
# e2e seed fixture (dev-only, seeds youhue_test): fixed test credentials are not secrets.
"seed_e2e.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config", "main"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "config", "main.py"]
# the kit gate runs `mypy .`; keep strict typing on production code, but exclude autogenerated
# Alembic migrations and tests (tests are exercised by pytest, not strictly typed).
exclude = ["^alembic/", "^tests/"]

# authlib (OIDC/JWKS client for staff SSO) ships no py.typed; don't fail strict on its missing stubs.
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.bandit]
# the kit gate runs `bandit -r . -ll`; scan our source only — not third-party deps, autogen, tests.
exclude_dirs = [".venv", "tests", "alembic"]
