[project]
name = "youhue-be"
version = "0.1.0"
description = "Youhue — Student Wellbeing Check-in Platform (backend, FastAPI)"
requires-python = ">=3.12"

# ---- gate tool config (the validation gate runs these) ----
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage is applied by the kit gate explicitly (make verify runs `pytest --cov --cov-fail-under`);
# keep it out of addopts so targeted runs (e.g. `pytest -m authz`) are not coverage-gated.
addopts = "--strict-markers"
markers = [
    "authz: authorization deny-cell test — a forbidden action MUST fail (Spine #7 deny-cell coverage)",
]

[tool.coverage.run]
source = ["src", "config", "main"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "config", "."]
# `worktrees/` holds Batch-03's per-ticket git worktrees, each a full nested checkout with its own
# `src`/`tests` — without this exclude, `ruff check .` (the exact command the gate invokes) walks
# into whichever worktrees happen to exist alongside this one and picks up their transient/mid-edit
# state, causing intermittent gate failures unrelated to the actual pushed diff (same class of bug
# already fixed for mypy below; found live, blocking every lane's push, 2026-07-26).
extend-exclude = ["alembic", "worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# tests may use assert (S101) — allowed there
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "S105", "S106", "S107"]
# e2e seed fixture (dev-only, seeds youhue_test): fixed test credentials are not secrets.
"seed_e2e.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config", "main"]

# fastapi.Depends/Query/Path/Body are already bugbear's default immutable-call allowlist;
# fastapi.File (FR-03-01 roster upload) is the same dependency-injection pattern, just missing
# from that default list — not a mutable-default bug.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "config", "main.py"]
# the kit gate runs `mypy .`; keep strict typing on production code, but exclude autogenerated
# Alembic migrations and tests (tests are exercised by pytest, not strictly typed).
# `^worktrees/` excludes per-ticket git worktrees nested under this repo (Batch-03's convention) —
# each is a full nested checkout with its own `config`/`src` packages; without this exclude, `mypy .`
# (the exact command the gate invokes) walks into them and fails EVERY push with "Duplicate module
# named X" the moment a second worktree exists alongside this one (found live, blocking the gate,
# 2026-07-26 — not a per-ticket code defect).
exclude = ["^alembic/", "^tests/", "^worktrees/"]

# authlib (OIDC/JWKS client for staff SSO) ships no py.typed; don't fail strict on its missing stubs.
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

# boto3/botocore (FR-20-01 object storage) ship no py.typed / stubs package installed here.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.bandit]
# the kit gate runs `bandit -r . -ll`; scan our source only — not third-party deps, autogen, tests.
exclude_dirs = [".venv", "tests", "alembic"]
